<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" font-family="'Space Grotesk', 'Segoe UI', sans-serif">
  <rect width="1600" height="720" fill="#F5F4F1"/>

  <text x="100" y="140" fill="#6A6A6A" font-family="'JetBrains Mono', monospace" font-size="20" letter-spacing="6">// OPERATIONS PLATFORM</text>
  <text x="100" y="212" fill="#181818" font-size="64" font-weight="600" letter-spacing="-1">Amigo Translator</text>
  <text x="100" y="250" fill="#555555" font-size="20">Interpreter dispatch, matching, and pay — one shared workflow.</text>
  <text x="100" y="284" fill="#6A6A6A" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1.5">TASMANIAN INTERPRETING BUSINESS &#183; OWNER-APPROVED MVP</text>

  <text x="100" y="344" fill="#6A6A6A" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="4">JOB LIFECYCLE</text>

  <!-- Card 1: Dispatch -->
  <rect x="100" y="380" width="257.6" height="220" rx="14" fill="#EEF3FB" stroke="#D8D5CF"/>
  <text x="126" y="424" fill="#1F65D3" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1.5">01</text>
  <text x="126" y="474" fill="#181818" font-size="26" font-weight="600">Dispatch</text>
  <text x="126" y="506" fill="#6A6A6A" font-size="14.5">Job goes out</text>

  <text x="371" y="498" fill="#B8B4AC" font-size="24">&#8594;</text>

  <!-- Card 2: Match -->
  <rect x="385.6" y="380" width="257.6" height="220" rx="14" fill="#F1EEF9" stroke="#D8D5CF"/>
  <text x="411.6" y="424" fill="#5B43A8" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1.5">02</text>
  <text x="411.6" y="474" fill="#181818" font-size="26" font-weight="600">Match</text>
  <text x="411.6" y="506" fill="#6A6A6A" font-size="14.5">Eligible interpreter</text>

  <text x="656.6" y="498" fill="#B8B4AC" font-size="24">&#8594;</text>

  <!-- Card 3: Complete -->
  <rect x="671.2" y="380" width="257.6" height="220" rx="14" fill="#EDF4EE" stroke="#D8D5CF"/>
  <text x="697.2" y="424" fill="#2E7D46" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1.5">03</text>
  <text x="697.2" y="474" fill="#181818" font-size="26" font-weight="600">Complete</text>
  <text x="697.2" y="506" fill="#6A6A6A" font-size="14.5">Job finished, mobile</text>

  <text x="942.2" y="498" fill="#B8B4AC" font-size="24">&#8594;</text>

  <!-- Card 4: Comply -->
  <rect x="956.8" y="380" width="257.6" height="220" rx="14" fill="#F8F1E3" stroke="#D8D5CF"/>
  <text x="982.8" y="424" fill="#8B6318" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1.5">04</text>
  <text x="982.8" y="474" fill="#181818" font-size="26" font-weight="600">Comply</text>
  <text x="982.8" y="506" fill="#6A6A6A" font-size="14.5">Compliance tracked</text>

  <text x="1227.8" y="498" fill="#B8B4AC" font-size="24">&#8594;</text>

  <!-- Card 5: Approve Pay -->
  <rect x="1242.4" y="380" width="257.6" height="220" rx="14" fill="#E9F3F2" stroke="#D8D5CF"/>
  <text x="1268.4" y="424" fill="#1E7E74" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1.5">05</text>
  <text x="1268.4" y="474" fill="#181818" font-size="26" font-weight="600">Approve Pay</text>
  <text x="1268.4" y="506" fill="#6A6A6A" font-size="14.5">Voucher approved</text>

  <line x1="100" y1="646" x2="1500" y2="646" stroke="#D8D5CF"/>
  <text x="100" y="682" fill="#6A6A6A" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="1.2">STAFF &#183; DESKTOP WEB APP</text>
  <text x="1220" y="682" fill="#6A6A6A" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="1.2">INTERPRETER &#183; MOBILE APP</text>
</svg>
