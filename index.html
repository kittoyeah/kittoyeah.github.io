    /* Hallmark · genre: modern-minimal · tone: restrained technical · anchor: cobalt · macrostructure: Split Studio / Portfolio Grid / Index-First / Narrative Workflow · design-system: design.md · designed-as-app

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      overflow-x: clip;
      max-width: 100%;
    }

    html {

      color-scheme: light;
      scroll-behavior: smooth;
    }

    html[data-theme="dark"] { color-scheme: dark; }

    body {

      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.65;
      text-size-adjust: 100%;

    }

    h1,
    h2,
    h3 {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--color-ink);
      font-family: var(--font-display) !important;
      font-style: normal;
      letter-spacing: -0.03em !important;
      text-wrap: balance;
    }

    h1 { font-size: clamp(2.375rem, 5vw, var(--text-3xl)) !important; font-weight: 700 !important; line-height: 1.04 !important; }
    h2 { font-size: clamp(var(--text-lg), 3vw, var(--text-xl)) !important; line-height: 1.1 !important; }
    h3 { font-size: var(--text-md) !important; line-height: 1.2 !important; }
    p, li { overflow-wrap: break-word; text-wrap: pretty; }

      line-height: 1.4;
